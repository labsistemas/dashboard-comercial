events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr notice;

    server_tokens off;

    sendfile        on;
    keepalive_timeout  65;

    client_max_body_size 50m;

    # Timeouts para proxy
    proxy_connect_timeout       60s;
    proxy_send_timeout          60s;
    proxy_read_timeout          60s;
    send_timeout                60s;

    # Mapeamento de conexão para WebSocket (se necessário no futuro)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_user_agent $is_scanner {
        default 0;
        ~*nmap 1;
        ~*masscan 1;
        ~*zgrab 1;
    }

    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=5r/s;

    # Upstream para Backend API
    upstream backend {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;
        root /usr/share/nginx/html;
        index index.html;

        if ($is_scanner) { return 444; }
        if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$ ) { return 444; }

        limit_req zone=per_ip burst=60 nodelay;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location ^~ /socket.io/ {
            proxy_pass https://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_cache_bypass $http_upgrade;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /app/backend/certs/internal.crt;
            proxy_ssl_name localhost;
            proxy_ssl_server_name on;

            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # Backend API - deve vir antes de location / para ter prioridade
        location ^~ /api/ {
            # Garantir que o path completo seja preservado
            proxy_pass https://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_cache_bypass $http_upgrade;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /app/backend/certs/internal.crt;
            proxy_ssl_name localhost;
            proxy_ssl_server_name on;
            
            # Timeouts específicos para API
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            proxy_request_buffering off;

            limit_req zone=api_per_ip burst=30 nodelay;
        }

        # Uploads
        location /uploads/ {
            proxy_pass https://backend/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /app/backend/certs/internal.crt;
            proxy_ssl_name localhost;
            proxy_ssl_server_name on;
        }

        location ~* \.map$ {
            return 404;
        }

        location ~* \.(?:css|js|gif|jpe?g|png|svg|woff2?|ttf|eot|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
